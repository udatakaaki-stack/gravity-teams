<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TELL ALERT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/NotoSansJP-subset-Bold.woff2" as="font" type="font/woff2" crossorigin>
<title>TELL ALERT</title>
<style>
/* ── 日本語フォント ──
   端末に日本語フォントが無い・言語設定が日本語でない場合、漢字が中国語の字形（例：直・角・骨）で
   表示されることがある。どの端末でも日本の字形になるよう、日本語フォント（Noto Sans CJK JPを
   JIS第1水準漢字とアプリで使う文字に絞ったもの）を同梱して最優先で使う。
   同梱フォントに無い漢字（人名の珍しい字など）は、下の font-family の順に端末の日本語フォントで表示する。 */
@font-face{font-family:"TellJP";src:url("fonts/NotoSansJP-subset-Regular.woff2") format("woff2");font-weight:100 500;font-display:swap}
@font-face{font-family:"TellJP";src:url("fonts/NotoSansJP-subset-Bold.woff2") format("woff2");font-weight:600 900;font-display:swap}

/* ── 配色（ダーク：ベンチ・ナイター向け） ── */
:root{
  --bg:#050b14;--bg2:#0c1727;--bg3:#13223a;--line:#22395a;
  --text:#eef3fa;--sub:#b0c1d6;--dim:#7089a6;
  --accent:#f27020;--S:#4f95ff;--B:#ff5470;
  --ok:#2fd27a;--warn:#f5b52e;--alert:#ff8a3d;--crit:#ff4d4d;
  color-scheme:dark;
}
/* ── 配色（屋外：直射日光でも読める高コントラスト） ── */
:root[data-theme="light"]{
  --bg:#ffffff;--bg2:#f1f4f8;--bg3:#e1e8f0;--line:#aebdcf;
  --text:#05090f;--sub:#26354a;--dim:#55657a;
  --accent:#c2410c;--S:#0040b8;--B:#b80d2a;
  --ok:#0b6e30;--warn:#8f4f00;--alert:#b83a08;--crit:#a8101a;
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root[data-theme="auto"]{
    --bg:#ffffff;--bg2:#f1f4f8;--bg3:#e1e8f0;--line:#aebdcf;
    --text:#05090f;--sub:#26354a;--dim:#55657a;
    --accent:#c2410c;--S:#0040b8;--B:#b80d2a;
    --ok:#0b6e30;--warn:#8f4f00;--alert:#b83a08;--crit:#a8101a;
    color-scheme:light;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--text);font:15px/1.6 "TellJP","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic","Meiryo","IPAexGothic","IPAGothic","TakaoGothic","VL Gothic",-apple-system,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh;overflow-x:hidden;
  word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere;font-feature-settings:"palt" 0}
.ic{display:inline-block;vertical-align:-0.2em;flex-shrink:0}
.logo{color:#fff}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:none;touch-action:manipulation}
button:disabled{opacity:.4;cursor:not-allowed}
img{display:block;max-width:100%}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

.wrap{max-width:720px;margin:0 auto;padding-block:12px calc(100px + env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ヘッダー */
.hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-t{flex:1;min-width:0}
.brand{font-weight:900;letter-spacing:.08em;color:var(--accent);font-size:15px}
.hdr-sub{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--sub);display:flex;align-items:center;justify-content:center}
.chip{font-size:11px;font-weight:800;padding:4px 8px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.chip-ai{color:var(--S);border-color:var(--S)}
.chip-off{color:var(--ok);border-color:var(--ok)}

/* 共通部品 */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);font-weight:800;font-size:15px;text-align:center;line-height:1.3}
.btn:active:not(:disabled){transform:scale(.98);opacity:.85}
.btn-main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-ai{background:var(--S);border-color:var(--S);color:#fff}
.btn-danger{background:transparent;border-color:var(--crit);color:var(--crit)}
.btn.sm{min-height:40px;padding:7px 12px;font-size:14px}
.btn.xs{min-height:34px;padding:4px 10px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.row{display:flex;align-items:center;gap:8px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{margin-top:10px}.mb{margin-bottom:10px}
.sec{font-size:15px;font-weight:900}
.note{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:10px}
.small{font-size:12px;color:var(--sub)}
.dim{color:var(--dim)}
.empty{text-align:center;padding:28px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--sub);font-size:14px;line-height:1.8;margin-bottom:12px}
.empty.sm{padding:16px;font-size:13px;text-align:left}
.steps{text-align:left;margin:12px auto 16px;max-width:420px}
.steps li{margin:0 0 8px 1.2em}

/* フォーム */
.field{margin-bottom:12px}
.field>label{display:block;font-size:13px;font-weight:800;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea,.sel{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;outline:none}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.help{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.6}
.seg{display:flex;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:800;font-size:14px;color:var(--sub);padding:4px 6px;line-height:1.25}
.seg button.on{background:var(--accent);color:#fff}
.pick-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick-row label{cursor:pointer;position:relative}
.preview{position:relative;margin-top:8px}
.preview img{width:100%;max-height:240px;object-fit:contain;border-radius:10px;background:#000}
.preview .x{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:16px}

/* バッジ */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:800;border:1px solid currentColor;white-space:nowrap}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-alert{color:var(--alert)}.c-crit{color:var(--crit)}.c-dim{color:var(--dim)}.c-S{color:var(--S)}.c-B{color:var(--B)}

/* 投手一覧 */
.pcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.pcard.lv-alert,.pcard.lv-crit{border-width:2px}
.pcard.lv-alert{border-color:var(--alert)}.pcard.lv-crit{border-color:var(--crit)}
.thumb{width:64px;height:52px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.pname{font-size:17px;font-weight:900}
.hand{font-size:12px;color:var(--sub);font-weight:700;margin-left:4px}
.meta{font-size:12px;color:var(--sub)}

/* アラートバナー */
.banner{border-radius:14px;padding:12px 14px;margin-bottom:10px;border:2px solid currentColor;background:var(--bg2)}
.banner .bt{font-weight:900;font-size:17px}
.banner .bm{color:var(--text);font-size:14px;margin-top:4px;line-height:1.6}
.banner.pulse{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.015)}}

/* 下部タブ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{min-height:60px;font-size:13px;font-weight:800;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab .ti{line-height:1;display:flex}
.tab.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}

/* 計測画面 */
.ctx{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctx .sel{width:auto;min-width:92px;min-height:42px;padding:6px 10px}
.ctx .seg{flex:1;min-width:150px}
.count{font-weight:900;font-size:16px;color:var(--sub)}
.step{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;margin:14px 0 8px}
.step span{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.obs-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.obs-h b{font-size:16px}
.tm{font-size:12px;color:var(--dim)}
.cue{font-size:13px;color:var(--sub);margin-bottom:8px}
.obs-btns{display:grid;grid-template-columns:1fr 1fr 74px;gap:6px}
.ob{min-height:66px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.25}
.ob b{font-size:15px}
.ob small{font-size:11px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ob.s{border-color:var(--S)}.ob.s b{color:var(--S)}
.ob.b{border-color:var(--B)}.ob.b b{color:var(--B)}
.ob.on.s{background:var(--S)}.ob.on.b{background:var(--B)}.ob.on.q{background:var(--dim);border-color:var(--dim)}
.ob.on b,.ob.on small{color:#fff}
.ob.p{border-color:var(--accent)}.ob.p b{color:var(--accent)}.ob.on.p{background:var(--accent)}
.ob.n{border-color:var(--line)}.ob.on.n{background:var(--text);border-color:var(--text)}
.ob.on.p b,.ob.on.p small{color:#fff}.ob.on.n b,.ob.on.n small{color:var(--bg)}
.tempo-row{display:grid;grid-template-columns:1fr 74px;gap:6px}
.tw{min-height:96px;border-radius:14px;border:3px solid var(--accent);background:var(--bg);font-weight:900;font-size:16px;color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tw.run{background:var(--accent);color:#fff}
.tw .big{font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.tw small{font-size:12px;font-weight:700;opacity:.9}
.tpl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tpl button{border:1px dashed var(--accent);color:var(--accent);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:800}
.pred{border-radius:16px;border:2px solid var(--line);padding:12px 14px;margin:12px 0 4px;background:var(--bg2);text-align:center}
.pred.S{border-color:var(--S)}.pred.B{border-color:var(--B)}
.pred-l{font-size:12px;font-weight:800;color:var(--sub)}
.pred-big{font-size:30px;font-weight:900;line-height:1.2;margin:2px 0}
.pred.S .pred-big{color:var(--S)}.pred.B .pred-big{color:var(--B)}
.pred-big span{font-size:22px}
.pred-why{font-size:12px;color:var(--sub)}
.pred-warn{font-size:12px;color:var(--warn);font-weight:800;margin-top:4px}
.res-h{font-size:13px;font-weight:900;margin:8px 0 6px}
.res-h.s{color:var(--S)}.res-h.b{color:var(--B)}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.res{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-weight:900;font-size:15px}
.res.s{border-left:6px solid var(--S)}.res.b{border-left:6px solid var(--B)}
.res:active{transform:scale(.97)}
.recent{font-size:13px;color:var(--sub)}
.recent div{padding:5px 0;border-bottom:1px dashed var(--line)}

/* テル一覧 */
.tcard{padding:0;overflow:hidden}
.tc-head{display:flex;gap:10px;padding:12px 14px;align-items:flex-start;width:100%;text-align:left}
.tc-bar{width:5px;align-self:stretch;border-radius:3px;flex-shrink:0}
.tc-body{padding:0 14px 12px;border-top:1px solid var(--line)}
.stat-line{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--sub);margin-top:4px}
.stat-line b{color:var(--text)}
.alert-msg{font-size:13px;font-weight:800;margin-top:6px}
.sb{border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6;border:1px solid var(--line)}
.sb .k{font-size:12px;font-weight:900;margin-bottom:2px}
.sb.s{border-color:var(--S)}.sb.s .k{color:var(--S)}
.sb.b{border-color:var(--B)}.sb.b .k{color:var(--B)}
.refimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;margin-top:6px;background:#000}
.inactive{opacity:.55}

/* 比較 */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0}
.cmp img{width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:8px;background:#000}
.cmp figcaption{font-size:12px;font-weight:800;color:var(--sub);margin-top:3px}
.st-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.st-btns button{min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:800;line-height:1.2}
.st-btns button.on{color:#fff}
.st-btns button.on.ok{background:var(--ok);border-color:var(--ok)}
.st-btns button.on.warn{background:var(--warn);border-color:var(--warn)}
.st-btns button.on.alert{background:var(--alert);border-color:var(--alert)}
.st-btns button.on.crit{background:var(--crit);border-color:var(--crit)}
.st-btns button.on.dim{background:var(--dim);border-color:var(--dim)}

/* 記録 */
.log-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.log-row .n{font-weight:900;width:38px;flex-shrink:0;color:var(--sub)}
.log-row .x{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);color:var(--dim);flex-shrink:0}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px;font-weight:900}
.kpi span{font-size:11px;color:var(--sub);font-weight:700}
pre.share{white-space:pre-wrap;font:13px/1.7 inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}

/* モーダル */
.modal-bg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg2);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line)}
@media (min-width:640px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.m-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.m-head b{font-size:17px}
.m-head .x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);font-size:18px}
.frame-modal video{width:100%;max-height:52vh;background:#000;border-radius:10px;margin:8px 0}
.frame-modal input[type=range]{width:100%;height:36px}
.ftime{text-align:center;font-size:13px;color:var(--sub);margin-bottom:8px}
.dlg{max-width:440px;border-radius:18px}
.dlg-msg{font-size:15px;line-height:1.8;margin-bottom:16px;white-space:pre-wrap}
.dlg textarea{width:100%;min-height:200px;font:12px/1.5 ui-monospace,monospace;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);margin-bottom:10px}
.sample-note{border:2px dashed var(--warn);color:var(--text);border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:13px;line-height:1.7}
.chk{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:22px;height:22px;flex-shrink:0;accent-color:var(--accent)}
.chk b{display:block;font-size:15px}.chk small{font-size:12px;color:var(--sub)}
.cand{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:var(--bg)}

/* トースト */
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:300;max-width:92vw;padding:12px 18px;border-radius:12px;font-weight:800;font-size:15px;color:#fff;background:#253247;transition:all .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.t-ok{background:#0f7a3d}.toast.t-warn{background:#9a5a00}.toast.t-crit{background:#b3141b}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="dialog"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
// ══════════════════════════════════════════════
// 定数
// ══════════════════════════════════════════════
const APP_VERSION = '2.3.0';
// 共有ページ（claude.ai のアーティファクト等）で開いたとき true。ファイル保存・AI通信・オフライン化が使えない
const EMBED = !!window.TELL_EMBED;
const LS_DATA = 'tell_alert_v2';
const LS_SET = 'tell_alert_settings_v2';
const LS_OLD = 'tell_alert_final'; // 旧バージョンのデータ（引き継ぎ用）

const CATEGORIES = ['グラブ','握り・手首','肘','肩甲骨・肩','腕の振り','腰・骨盤','脚・足上げ','ステップ','体の向き','頭・目線','準備動作','テンポ・リズム','その他'];
const CAT_COLOR = {'グラブ':'#f27020','握り・手首':'#20c060','肘':'#f0a020','肩甲骨・肩':'#e84040','腰・骨盤':'#06b0c8','ステップ':'#8060f0','頭・目線':'#e040b0','テンポ・リズム':'#a080f0','その他':'#7a90a8','腕の振り':'#d05030','脚・足上げ':'#5070f0','体の向き':'#30a090','準備動作':'#a0a040'};
// 打者が使えるのは「リリースより前」に出るテルだけなので、フォロースルーは選択肢から外している
const TIMINGS = ['サイン交換・準備','セット・構え','始動・足上げ','テイクバック','トップ','リリース直前'];
const IMPORTANCE = ['高','中','低'];

// 二項分布の上側確率 P(X >= k)。「この的中数は偶然でも起こりうるか」を見るために使う
const LF=[0];
function lf(n){ for(let i=LF.length;i<=n;i++) LF[i]=LF[i-1]+Math.log(i); return LF[n]; }
function binomTail(k,n,p){
  if(k<=0) return 1;
  if(p>=1) return 1;
  let s=0;
  for(let i=k;i<=n;i++) s+=Math.exp(lf(n)-lf(i)-lf(n-i)+i*Math.log(p)+(n-i)*Math.log(1-p));
  return Math.min(1,s);
}

async function copyFrom(id){
  const el=document.getElementById(id);
  try{ await navigator.clipboard.writeText(el.value??el.textContent); toast('コピーしました','ok'); }
  catch{ if(el.select) el.select(); else { const r=document.createRange(); r.selectNodeContents(el); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast('文字を選択しました。長押しでコピーしてください','warn',3000); }
}

  try{ SET = {...DEFAULT_SET, ...(JSON.parse(localStorage.getItem(LS_SET))||{})}; }catch{ SET={...DEFAULT_SET}; }

const IMG = {}; // 画像キャッシュ id → dataURL
const IDB = {
  db:null, ok:false,
  async open(){
    try{
      this.db = await new Promise((res,rej)=>{
        const r=indexedDB.open('tell_alert_media',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('img');
        r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
      });
      this.ok=true;
    }catch{ this.ok=false; }
  },
  store(mode){ return this.db.transaction('img',mode).objectStore('img'); },
  put(id,v){
    IMG[id]=v;
    if(!this.ok) return Promise.resolve();
    return new Promise((res,rej)=>{ const r=this.store('readwrite').put(v,id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); })
      .catch(()=>toast('画像の保存に失敗しました（容量不足の可能性）','crit',5000));
  },
  del(id){ if(!id) return; delete IMG[id]; if(this.ok) try{ this.store('readwrite').delete(id); }catch{} },
  loadAll(){
    if(!this.ok) return Promise.resolve();
    return new Promise(res=>{
      const r=this.store('readonly').openCursor();
      r.onsuccess=()=>{ const c=r.result; if(c){ IMG[c.key]=c.value; c.continue(); } else res(); };
      r.onerror=()=>res();
    });
  },
};
async function storeImg(dataUrl){ if(!dataUrl) return null; const id='img_'+uid(); await IDB.put(id,dataUrl); return id; }
const imgSrc = v => !v ? null : (String(v).startsWith('data:') ? v : (IMG[v]||null));
// 新しい画像（dataURL）なら保存してIDを返す。既存IDならそのまま。消されたら古い画像を削除
async function commitImg(newVal, oldId){
  if(newVal && String(newVal).startsWith('data:')){ if(oldId) IDB.del(oldId); return await storeImg(newVal); }
  if(!newVal && oldId){ IDB.del(oldId); return null; }
  return newVal||null;
}
function pitcherImgIds(p){
  const ids=[p.thumbId];
  p.tells.forEach(t=>ids.push(t.imgS,t.imgB));
  p.scans.forEach(s=>ids.push(s.imgId));
  return ids.filter(Boolean);
}

// 画像・動画の取り込み
// ══════════════════════════════════════════════
function loadImage(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('画像を読み込めませんでした')); im.src=src; }); }
// スマホの写真は数MBあるので、長辺1024pxのJPEGに縮小してから保存・送信する
function drawToJpeg(src,w,h,max=1024,q=0.8){
  const sc=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
async function fileToJpeg(file){
  const url=URL.createObjectURL(file);
  try{ const im=await loadImage(url); return drawToJpeg(im,im.naturalWidth,im.naturalHeight); }
  finally{ URL.revokeObjectURL(url); }
}
function pickButtons(target){
  return `<div class="pick-row">
    <label class="btn sm"><input class="vh" type="file" accept="image/*,video/*" capture="environment" data-target="${target}" onchange="onPick(event)">${ic('camera')}撮影する</label>
    <label class="btn sm"><input class="vh" type="file" accept="image/*,video/*" data-target="${target}" onchange="onPick(event)">${ic('film')}写真・動画から</label>
  </div>`;
}
function previewBox(v, clearFn){
  const src=imgSrc(v); if(!src) return '';
  return `<div class="preview"><img src="${src}" alt=""><button class="x" onclick="${clearFn}" aria-label="画像を外す">×</button></div>`;
}
async function onPick(ev){
  const input=ev.target, f=input.files&&input.files[0], target=input.dataset.target;
  input.value='';
  if(!f) return;
  if((f.type||'').startsWith('video/') || /\.(mov|mp4|m4v|webm|3gp)$/i.test(f.name)){ openFrameModal(f,target); return; }
  try{ deliver(target, await fileToJpeg(f)); }catch(e){ toast(e.message,'crit'); }
}
function deliver(target,d){
  if(target==='reg') S.form.img=d;
  else if(target==='tellS') S.form.imgS=d;
  else if(target==='tellB') S.form.imgB=d;
  else if(target==='scan') S.scan.img=d;
  else if(target==='aiS') S.ai.imgS=d;
  else if(target==='aiB') S.ai.imgB=d;
  render(); toast('画像を取り込みました','ok');
}

// 動画からコマを切り出す（静止画1枚だとテルの出る瞬間を逃しやすいので、動画で撮ってコマ送りで選ぶ）
let FR=null;
function openFrameModal(file,target){
  closeFrame();
  const url=URL.createObjectURL(file);
  FR={url,target};
  document.getElementById('overlay').innerHTML=`
  <div class="modal-bg"><div class="modal frame-modal">
    <div class="m-head"><b>コマを選ぶ</b><button class="x" onclick="closeFrame()" aria-label="閉じる">×</button></div>
    <div class="note">スライダーとコマ送りで、テルが一番はっきり見える瞬間に合わせてください。</div>
    <video id="fv" playsinline muted preload="auto" src="${url}"></video>
    <input id="fslider" type="range" min="0" max="0" step="0.001" value="0" aria-label="再生位置">
    <div class="ftime" id="ftime">読み込み中…</div>
    <div class="grid3 mb">
      <button class="btn sm" onclick="fStep(-1)">← 1コマ</button>
      <button class="btn sm" id="fplay" onclick="fPlay()">再生 1/4速</button>

    </div>

  </div></div>`;
  const v=document.getElementById('fv'), s=document.getElementById('fslider');
  const upd=()=>{ s.value=v.currentTime; document.getElementById('ftime').textContent=`${v.currentTime.toFixed(2)}秒 / ${(v.duration||0).toFixed(2)}秒`; };
  v.addEventListener('loadedmetadata',()=>{ s.max=v.duration||0; v.currentTime=Math.min(0.05,v.duration||0); upd(); });
  v.addEventListener('timeupdate',upd); v.addEventListener('seeked',upd);
  v.addEventListener('pause',()=>{ const b=document.getElementById('fplay'); if(b) b.textContent='再生 1/4速'; });
  v.addEventListener('error',()=>toast('この動画形式は読み込めませんでした','crit',4000));

function fStep(d){ const v=document.getElementById('fv'); if(!v) return; v.pause(); v.currentTime=clamp(v.currentTime+d/30,0,v.duration||0); }
function fPlay(){
  const v=document.getElementById('fv'), b=document.getElementById('fplay'); if(!v) return;

// ══════════════════════════════════════════════
// 分析ロジック（オフラインで動く。アプリの心臓部）
// ══════════════════════════════════════════════
// 各テルの「サインの見え方」を言葉にする
// 「2つの状態」型：どちらの状態が直球に多いかを記録から決める
// 状態ごとに2球以上、直球・変化球それぞれ2球以上の記録があるときだけ決める（少なすぎる記録で決めつけない）
function stateCounts(pitches,t){ const c={aS:0,aB:0,bS:0,bB:0}; for(const x of pitches){ const o=x.obs?.[t.id]; if(o==='a'||o==='b') c[o+x.actual]++; } return c; }
function learnState(c){
  const na=c.aS+c.aB, nb=c.bS+c.bB;
  if(na<2||nb<2||c.aS+c.bS<2||c.aB+c.bB<2) return null;
  const pa=c.aS/na, pb=c.bS/nb; if(pa===pb) return null;
  return pa>pb?'aS':'aB';
}
function stateMap(p,t){ return t.map==='auto'?learnState(stateCounts(p.pitches,t)):t.map; }
function stateSide(o,m){ if(o==='?') return '?'; if((o!=='a'&&o!=='b')||!m) return null; return (o==='a')===(m==='aS')?'S':'B'; }
// 各テルの「サインの見え方」を言葉にする
function signText(t,side,p){
  if(t.type==='state'){
    const m=p?stateMap(p,t):(t.map==='auto'?null:t.map);
    if(!m) return `「${t.la}」か「${t.lb}」（記録から判断中）`;
    return `「${(side==='S')===(m==='aS')?t.la:t.lb}」`;
  }
  if(t.type==='presence') return side===t.side?`「${t.action}」が出る`:`「${t.action}」が出ない`;
  if(t.type==='tempo'){
    const bf=tempoBFast(t,p?tempoInfo(p,t):null);
    if(bf==null) return `${pointName(t.tStart)}→${pointName(t.tEnd)}の時間（記録から判断中）`;
    const fast=bf===(side==='B'); return `${pointName(t.tStart)}→${pointName(t.tEnd)}が${fast?'速い':'遅い'}`;
  }
  return side==='S'?t.straight:t.breaking;
}
// テンポ型：直球・変化球それぞれの平均から境目を決める
const mean = a => a.reduce((x,y)=>x+y,0)/a.length;
const sd = a => a.length>1?Math.sqrt(a.reduce((x,y)=>x+(y-mean(a))**2,0)/(a.length-1)):0;
function tempoThr(sS,sB){ return (sS.length>=TEMPO_MIN_EACH && sB.length>=TEMPO_MIN_EACH) ? (mean(sS)+mean(sB))/2 : null; }
// 変化球の時に速いか（Bfast/Bslow は指定どおり、auto は平均の比較で決める）
function tempoBFast(t,info){ if(t.dir==='Bfast') return true; if(t.dir==='Bslow') return false; if(!info||info.thr==null) return null; return info.mB<info.mS; }
function tempoSide(t,sec,thr,bFast){ const fast=sec<thr; return bFast?(fast?'B':'S'):(fast?'S':'B'); }
function tempoInfo(p,t){
  const sS=[],sB=[];
  p.pitches.forEach(x=>{ const v=x.tempo?.[t.id]; if(typeof v==='number') (x.actual==='S'?sS:sB).push(v); });
  const thr=tempoThr(sS,sB);
  return {sS,sB,thr,mS:sS.length?mean(sS):null,mB:sB.length?mean(sB):null,dS:sd(sS),dB:sd(sB)};
}
// 1球ごとのサイン（'S' / 'B' / '?' / null=未確認）
// テンポ型は、その球より「前」の記録だけで決めた境目で判定する（後から当てはめて的中率を水増ししないため）
function obsSeries(p,t){
  if(t.type==='state'){
    // どちらが直球のサインかを記録から決める場合も、その球より前の記録だけで決める
    const out=[], c={aS:0,aB:0,bS:0,bB:0};
    for(const x of p.pitches){
      const o=x.obs?.[t.id];
      if(o==='?'){ out.push('?'); continue; }
      if(o!=='a'&&o!=='b'){ out.push(null); continue; }
      out.push(stateSide(o, t.map==='auto'?learnState(c):t.map));
      c[o+x.actual]++;
    }
    return out;
  }
  if(t.type!=='tempo') return p.pitches.map(x=>x.obs?.[t.id]||null);
  const out=[], sS=[], sB=[];
  for(const x of p.pitches){
    const v=x.tempo?.[t.id];
    if(typeof v!=='number'){ out.push(x.obs?.[t.id]==='?'?'?':null); continue; }
    const thr=tempoThr(sS,sB);
    out.push(thr==null?null:tempoSide(t,v,thr,tempoBFast(t,{thr,mS:mean(sS),mB:mean(sB)})));
    (x.actual==='S'?sS:sB).push(v);
  }
  return out;
}
// テル1つ分の成績
function tellStats(p,t){
  const W=SET.win, minN=SET.minN, ser=obsSeries(p,t);
  const asked=[]; p.pitches.forEach((x,i)=>{ if(ser[i]) asked.push({o:ser[i],actual:x.actual,set:x.set}); });
  const seen=asked.filter(r=>r.o==='S'||r.o==='B');
  const hit=r=>r.o===r.actual;
  const nAll=seen.length, kAll=seen.filter(hit).length;
  // 主な指標：出たら分かる型は「出た時にどれだけ当たるか」、それ以外は全体の的中率
  // 比較の基準：出たら分かる型はその球種の割合、それ以外は「いつも多い方を張った場合」（最低50%）
  let n,k,p0,n0=0,k0=0;
  if(t.type==='presence'){
    const shown=seen.filter(r=>r.o===t.side), hidden=seen.filter(r=>r.o!==t.side);
    n=shown.length; k=shown.filter(hit).length; n0=hidden.length; k0=hidden.filter(hit).length;
    p0=nAll?seen.filter(r=>r.actual===t.side).length/nAll:0.5;
  }else{
    n=nAll; k=kAll; const nS=seen.filter(r=>r.actual==='S').length;
    p0=nAll?Math.max(nS/nAll,1-nS/nAll,0.5):0.5;
  }
  const acc=n?k/n:0, pval=n?binomTail(k,n,p0):1;
  const needN=t.type==='presence'?Math.max(4,Math.ceil(minN/2)):minN;
  // 候補を多く同時に調べるほど、偶然当たって見えるものが出やすい。登録中の項目数で割って基準を厳しくする
  const nCand=Math.max(1,p.tells.filter(x=>x.active).length), alpha=0.05/nCand;
  let ev;
  if(n<needN) ev='few'; else if(pval<alpha) ev='strong'; else if(pval<0.2) ev='promising'; else ev='weak';

  const rec=seen.slice(-W), rk=rec.filter(hit).length, racc=rec.length?rk/rec.length:0;
  const early=seen.slice(0,-W), ek=early.filter(hit).length, eacc=early.length?ek/early.length:0;
  const recAsked=asked.slice(-W), earlyAsked=asked.slice(0,-W);
  const hidRate=a=>a.length?a.filter(r=>r.o==='?').length/a.length:0;
  const cov=asked.length?nAll/asked.length:0;
  const split=['W','S'].map(m=>{ const r=seen.filter(x=>x.set===m); return {m,n:r.length,k:r.filter(hit).length}; });
  // 変化が起きる前の時点で「有効」だったか（主力テルの消失は緊急扱いにするため）
  const eS=early.filter(x=>x.actual==='S').length;
  const earlyStrong=early.length>=minN && binomTail(ek,early.length,Math.max(eS/early.length,1-eS/early.length,0.5))<alpha;
  // 変化検知：それまで当たっていたテルが直近で当たらなくなった／見えなくなった
  let alert=null;
  if(early.length>=minN && eacc>=0.7 && rec.length>=W && racc<=SET.drop/100){
    alert={level:'ALERT', msg:`直近${rec.length}球の的中が${rk}/${rec.length}に低下（それまで${pct(eacc)}）。修正された可能性があります`};
  }else if(earlyAsked.length>=minN && hidRate(earlyAsked)<0.3 && recAsked.length>=W && hidRate(recAsked)>=0.5){
    alert={level:'CAUTION', msg:`直近で「見えず」が${pct(hidRate(recAsked))}に増加。隠し始めたか、撮影位置が変わった可能性`};
  }else if(early.length>=minN && eacc>=0.7 && rec.length>=W && racc<eacc-0.2){
    alert={level:'CAUTION', msg:`直近${rec.length}球の的中が${rk}/${rec.length}とやや低下（それまで${pct(eacc)}）`};
  }
  return {asked:asked.length,n,k,acc,p0,pval,ev,alpha,nCand,needN,nAll,kAll,n0,k0,earlyStrong,rec:rec.length,rk,racc,cov,split,alert,
    tempo:t.type==='tempo'?tempoInfo(p,t):null};
}
const EV_RANK={strong:0,promising:1,few:2,weak:3};
function evBadge(st){
  if(st.ev==='few')       return `<span class="badge c-dim">データ不足 ${st.n}/${st.needN}球</span>`;
  if(st.ev==='weak')      return `<span class="badge c-dim">未確認 ${pct(st.acc)}</span>`;
  if(st.ev==='promising') return `<span class="badge c-warn">有望 ${pct(st.acc)}</span>`;
  return `<span class="badge c-ok">有効 ${pct(st.acc)}</span>`;
}
function sortedTells(p){
  const imp={'高':0,'中':1,'低':2};
  return p.tells.map(t=>({t,st:tellStats(p,t)}))
    .sort((a,b)=> (b.t.active-a.t.active) || (EV_RANK[a.st.ev]-EV_RANK[b.st.ev]) || (b.st.acc-a.st.acc) || (imp[a.t.importance]-imp[b.t.importance]) || (TIMINGS.indexOf(a.t.timing)-TIMINGS.indexOf(b.t.timing)))
    .map(x=>x.t);
}

// 投手全体の状態
function overall(p){
  const items=p.tells.filter(t=>t.active).map(t=>({tell:t,st:tellStats(p,t)}));
  let level=p.pitches.length?'CLEAR':'NODATA';
  const msgs=[];
  items.forEach(x=>{
    if(!x.st.alert) return;
    const lv=(x.st.alert.level==='ALERT'&&x.st.earlyStrong)?'CRITICAL':x.st.alert.level; // 主力テルの消失は緊急
    if(lvRank(lv)>lvRank(level)) level=lv;
    msgs.push({lv,text:`${x.tell.part}：${x.st.alert.msg}`});
  });
  // 最後の画像比較が、最後の投球記録より新しければ反映
  const sc=p.scans[p.scans.length-1], lastPitch=p.pitches[p.pitches.length-1];
  if(sc && sc.source!=='legacy' && (!lastPitch || sc.ts>=lastPitch.ts) && lvRank(sc.overall)>=lvRank('CAUTION')){
    if(lvRank(sc.overall)>lvRank(level)) level=sc.overall;
    msgs.push({lv:sc.overall,text:`画像比較（${sc.inning?sc.inning+'回 ':''}${fmtTime(sc.ts)}）：${sc.reason||'テルの変化を確認'}`});
  }
  const ranked=items.filter(x=>x.st.n>0).sort((a,b)=>(EV_RANK[a.st.ev]-EV_RANK[b.st.ev])||(b.st.acc-a.st.acc));
  return {level,msgs,best:ranked[0]||null,items};
}

// 今の1球で見えたサイン
function curObs(p,t){
  const o=S.cur.obs[t.id];
  if(t.type==='state') return o?stateSide(o,stateMap(p,t)):null;
  if(t.type!=='tempo') return o||null;
  if(o==='?') return '?';
  const sec=S.cur.tempo[t.id]?.sec; if(sec==null) return null;
  const info=tempoInfo(p,t); if(info.thr==null) return null;
  const bf=tempoBFast(t,info); return bf==null?null:tempoSide(t,sec,info.thr,bf);
}
function obsLabel(t,o,sec){
  if(t.type==='state') return o==='a'?t.la:o==='b'?t.lb:'見えず';
  if(o==='?') return t.type==='tempo'?'測れず':'見えず';
  if(t.type==='tempo') return sec!=null?sec.toFixed(2)+'秒':(o==='S'?'直':'変');
  if(t.type==='presence') return o===t.side?'出た':'出ない';
  return o==='S'?'直':'変';
}
// 予測：記録からベイズ推定（単純ベイズ）。記録が無いテルは「テル通りなら」の参考表示にとどめる
function predict(p){
  const H=p.pitches, nS=H.filter(x=>x.actual==='S').length;
  const prior=(nS+1)/(H.length+2);
  let lo=Math.log(prior/(1-prior));
  const used=[];
  for(const t of p.tells.filter(x=>x.active)){
    const o=curObs(p,t); if(o!=='S'&&o!=='B') continue;
    const ser=obsSeries(p,t);
    let a=0,b=0,tS=0,tB=0;
    H.forEach((x,i)=>{ const so=ser[i]; if(so!=='S'&&so!=='B') return; if(x.actual==='S'){tS++; if(so===o)a++;} else {tB++; if(so===o)b++;} });
    lo+=Math.log(((a+1)/(tS+2))/((b+1)/(tB+2)));
    used.push({tell:t,o,n:tS+tB,label:t.type==='state'?obsLabel(t,S.cur.obs[t.id]):obsLabel(t,o,S.cur.tempo[t.id]?.sec)});
  }
  const probS=1/(1+Math.exp(-lo));
  const votes=used.reduce((s,u)=>s+(u.o==='S'?1:-1),0);
  const unverified=used.length>0 && used.every(u=>u.n===0);
  return {prior,probS,used,votes,unverified,minN:used.length?Math.min(...used.map(u=>u.n)):0};
}

function scanLevel(p,status){
  let lv='NODATA';
  for(const t of p.tells){
    const s=status[t.id]; if(!s) continue;
    let l='CLEAR';
    if(s==='WEAKENED') l='CAUTION';
    else if(s==='MODIFIED'||s==='DISAPPEARED') l=t.importance==='高'?'CRITICAL':'ALERT';
    if(lvRank(l)>lvRank(lv)) lv=l;
  }
  return lv;
}

const imgBlock = d => ({type:'image',source:{type:'base64',media_type:'image/jpeg',data:String(d).split(',')[1]}});
async function callClaude(content, schema){
  if(!navigator.onLine) throw new Error('オフラインです。電波のある場所で実行してください');
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),120000);
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', signal:ctrl.signal,
      headers:{
        'content-type':'application/json',
        'x-api-key':SET.apiKey,
        'anthropic-version':'2026-10-21',
        'anthropic-beta':'server-side-fallback-2026-07-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body:JSON.stringify({
        model:SET.model, max_tokens:16000,
        fallbacks:'default',
        output_config:{ effort:'medium', format:{type:'json_schema',schema} },
        messages:[{role:'user',content}],
      }),
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok){
      if(res.status===401) throw new Error('APIキーが正しくありません');
      if(res.status===429) throw new Error('混み合っています。少し待って再実行してください');
      throw new Error(data?.error?.message||('通信エラー（'+res.status+'）'));
    }
    if(data.stop_reason==='refusal') throw new Error('AIがこの画像の分析を控えました');
    if(data.stop_reason==='max_tokens') throw new Error('AIの回答が途中で切れました。もう一度実行してください');
    const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    try{ return JSON.parse(text); }
    catch{ const m=text.match(/\{[\s\S]*\}/); if(m) return JSON.parse(m[0]); throw new Error('AIの回答を読み取れませんでした'); }
  }catch(e){
    if(e.name==='AbortError') throw new Error('時間切れです。電波状況を確認してください');
    throw e;
  }finally{ clearTimeout(timer); }
}
const DIFF_SCHEMA={type:'object',additionalProperties:false,required:['summary','candidates','caution','shooting_tip'],properties:{
  summary:{type:'string'},
  candidates:{type:'array',items:{type:'object',additionalProperties:false,required:['category','part','timing','straight','breaking','cue','confidence','reason'],properties:{
    category:{type:'string',enum:CATEGORIES}, part:{type:'string'}, timing:{type:'string',enum:TIMINGS},
    straight:{type:'string'}, breaking:{type:'string'}, cue:{type:'string'},
    confidence:{type:'string',enum:['高','中','低']}, reason:{type:'string'} }}},
  caution:{type:'string'}, shooting_tip:{type:'string'} }};
const SCAN_SCHEMA={type:'object',additionalProperties:false,required:['reason','image_quality','checks','new_findings'],properties:{
  reason:{type:'string'}, image_quality:{type:'string',enum:['良い','普通','悪い']},
  checks:{type:'array',items:{type:'object',additionalProperties:false,required:['tell_id','status','looks_like','note'],properties:{
    tell_id:{type:'string'}, status:{type:'string',enum:Object.keys(STATUS)},
    looks_like:{type:'string',enum:['直球側','変化球側','判断不可']}, note:{type:'string'} }}},
  new_findings:{type:'array',items:{type:'object',additionalProperties:false,required:['part','desc'],properties:{part:{type:'string'},desc:{type:'string'}}}} }};

function promptDiff(p){
  return `あなたは野球の投球動作を観察する分析担当です。
同じ投手の2枚の画像を比べます。1枚目は直球系を投げた時、2枚目は変化球系を投げた時の、なるべく同じ局面のコマです。
投手：${p.name}（${p.hand}）　メモ：${p.memo||'なし'}

2枚の違いのうち、打者や味方ベンチがリリースより前に目で確認できそうなもの（テル候補）を挙げてください。
・画像から実際に確認できる違いだけを書くこと。見えないことや判断できないことは書かない。
・撮影角度、コマのタイミングのずれ、画質による見かけ上の違いの可能性があるときは、reasonにそう書き、confidenceを「低」にする。
・動作の速さ・テンポは静止画では分からないので挙げない。
・確認できる違いがなければcandidatesは空配列にする。最大5件。
・straight／breakingには、それぞれの球種のときの見え方を短く書く。cueは打者向けの短い指示（15文字程度）。
・cautionには、この2枚だけで言えることの限界を1〜2文で書く。
・shooting_tipには、次に撮影するときの改善点を1文で書く。`;
}
function promptScan(p,tells){
  return `あなたは野球の投球動作を観察する分析担当です。
投手：${p.name}（${p.hand}）
登録済みのテル（球種によって形が変わる癖）が、試合中の最新のコマでもまだ確認できるかを調べます。
最後の画像が「今回のコマ」、それより前の画像は登録時の参考画像です。

テル一覧：
${JSON.stringify(tells.map(t=>({tell_id:t.id,part:t.part,timing:t.timing,straight_sign:signText(t,'S',p),breaking_sign:signText(t,'B',p)})),null,1)}

1枚のコマでは何を投げたかは分からないため、今回のコマが「直球時の形」か「変化球時の形」のどちらかに当てはまるかを見てください。
status：INTACT（どちらかの形がはっきり確認できる）、WEAKENED（形の差が小さくなっている）、MODIFIED（どちらにも当てはまらない別の動きになっている）、DISAPPEARED（その部位の特徴が見られない・隠されている）、UNKNOWN（角度・局面・画質のため判断できない）。
確信が持てないときは必ずUNKNOWNにし、推測で判定しないこと。
looks_likeには今回のコマがどちらの形に近いかを書く。tell_idは一覧の値をそのまま使う。
reasonは全体の判定根拠を1文で。new_findingsには登録外で目立つ違いがあれば書く（なければ空配列）。`;
}

function vTempo(p,t,st){

function vPrediction(p,pred){

    if(!p.pitches.length) return `<div class="pred"><div class="pred-l">予測</div><div class="small">サインをタップすると、ここに予測が出ます</div></div>`;

  }
  if(pred.unverified){
    if(pred.votes===0) return `<div class="pred"><div class="pred-l">予測（未検証）</div><div class="pred-big" style="font-size:22px">サインが食い違っています</div></div>`;
    const side=pred.votes>0?'S':'B';
    return `<div class="pred ${side}"><div class="pred-l">予測（未検証：このテルの記録がまだありません）</div>

  </div>`;
}
function pitchLine(p,x){
  const obs=p.tells.map(t=>{

  }).filter(Boolean).join(' ');
  const res=x.pred? (x.pred===x.actual?'<span class="c-ok">○的中</span>':'<span class="c-crit">×外れ</span>') : '';
  return `#${x.no||''} ${esc(x.inning||'')}回 ${x.set==='S'?'セット':'ワインド'}　${esc(obs)||'サインなし'} → <b class="c-${x.actual}">${esc(x.kind)}</b> ${res}`;
}

function vTells(p){
  const ts=sortedTells(p), nAct=p.tells.filter(t=>t.active).length;
  let h=`<div class="row-between"><h2 class="sec">観察項目（${p.tells.length}件）</h2>
    <div class="row"><button class="btn sm" onclick="openBulk()">リストから選ぶ</button><button class="btn btn-main sm" onclick="openTellEdit()">＋ 1件追加</button></div></div>
  <div class="note">的中率は「計測」タブの記録から自動で計算し、当たっている順に並べます。<br>
  <span class="c-ok">有効</span>：いつも多い方の球種を張るより当たっていて、偶然とは考えにくい。<br>
  <span class="c-warn">有望</span>：当たっているが、まだ偶然の可能性も残る。<br>
  <span class="c-dim">データ不足・未確認</span>：判断できる記録がまだない、または当たり方が偶然と区別できない。<br>
  候補を多く調べるほど、偶然当たって見える項目が出やすくなります。そのため「有効」の基準は、計測中の項目数に応じて厳しくしています（今は${nAct}件なので、偶然の確率が${(5/Math.max(1,nAct)).toFixed(nAct>5?1:0)}%未満）。<br>
  見分けに使えないと分かった項目は「休止」すると、計測画面がすっきりします。</div>`;
  if(SET.mode==='ai') h+=vAiDiff(p);
  if(!ts.length) h+=`<div class="empty sm">まだ観察項目がありません。「リストから選ぶ」で、気になる項目をまとめて追加できます。<br>どちらが直球のサインかは、記録が貯まるとアプリが判断します。</div>`;
  ts.forEach(t=>{ h+=vTellCard(p,t); });
  return h;
}

      <div class="tc-bar" style="background:${CAT_COLOR[t.category]||'#888'}"></div>

function vTempoDetail(ti){

function vCompare(p){
  const C=S.scan, tells=sortedTells(p).filter(t=>t.active&&t.type!=='tempo');
  let h=`<div class="note">試合の途中でフォームを撮り、登録時の参考画像と並べて目で比べます。投手がテルを修正していないかの確認用です。<br>球数が少ない序盤や、計測ができない打席の補助として使ってください。</div>
  <div class="card">
    <div class="sec mb">今回のコマ</div>
    ${C.img?previewBox(C.img,"S.scan.img=null;render()"):pickButtons('scan')}
    <div class="grid2 mt">
      <div class="field" style="margin:0"><label>イニング</label><select data-bind="scan.inning"><option value="">－</option>${INNINGS.map(n=>`<option value="${n}" ${C.inning===n?'selected':''}>${n}回</option>`).join('')}</select></div>
      <div class="field" style="margin:0"><label>メモ</label><input type="text" data-bind="scan.memo" value="${esc(C.memo)}" placeholder="例：腕の振りが速くなった"></div>
    </div>
  </div>`;
  if(!tells.length){ h+=`<div class="empty sm">比べるテルがありません。先に「テル」タブで登録してください。</div>`; return h+vScanHistory(p); }
  if(SET.mode==='ai') h+=`${C.error?`<div class="alert-msg c-crit mb">エラー：${esc(C.error)}</div>`:''}
    <button class="btn btn-ai full mb" onclick="runAiScan()" ${C.loading||!C.img?'disabled':''}>${C.loading?'<span class="spin"></span> AIが確認中…':'AIに下書き判定させる'}</button>`;
  if(C.ai) h+=`<div class="card" style="border-color:var(--S)"><div class="small c-S" style="font-weight:800">AIの見立て（画質：${esc(C.ai.image_quality)}）</div><div class="note" style="margin:4px 0 0">${esc(C.ai.reason)}</div>
    ${(C.ai.new_findings||[]).map(f=>`<div class="small">◆ ${esc(f.part)}：${esc(f.desc)}</div>`).join('')}</div>`;
  tells.forEach(t=>{
    const s=C.status[t.id], aiC=C.ai?.checks?.find(c=>c.tell_id===t.id);
    h+=`<div class="card">
      <div class="obs-h"><b>${esc(t.part)}</b><span class="tm">${esc(t.timing)}</span></div>
      ${(imgSrc(t.imgS)||imgSrc(t.imgB)||C.img)?`<div class="cmp mt">
        ${C.img?`<figure><img src="${C.img}" alt="今回"><figcaption>今回</figcaption></figure>`:''}
        ${imgSrc(t.imgS)?`<figure><img src="${imgSrc(t.imgS)}" alt="${esc(refCap(t,'S'))}"><figcaption>${esc(refCap(t,'S'))}</figcaption></figure>`:''}
        ${imgSrc(t.imgB)?`<figure><img src="${imgSrc(t.imgB)}" alt="${esc(refCap(t,'B'))}"><figcaption>${esc(refCap(t,'B'))}</figcaption></figure>`:''}
      </div>`:''}
      <div class="small mt"><span class="c-S">直球：</span>${esc(signText(t,'S',p)||'－')}　<span class="c-B">変化球：</span>${esc(signText(t,'B',p)||'－')}</div>
      ${aiC?`<div class="small c-S mt">AI：${STATUS[aiC.status]?.label||''}・${esc(aiC.looks_like)}：${esc(aiC.note)}</div>`:''}
      <div class="st-btns">${Object.entries(STATUS).map(([k,v])=>`<button class="${s===k?'on '+v.c:''}" onclick="setScanStatus('${t.id}','${k}')">${v.icon}<br>${v.label}</button>`).join('')}</div>
    </div>`;
  });
  const lv=scanLevel(p,C.status);
  h+=`<button class="btn btn-main full" onclick="saveScan()" ${Object.keys(C.status).length?'':'disabled'}>この比較を保存（判定：${LEVEL[lv].label}）</button>`;
  return h+vScanHistory(p);
}
function vScanHistory(p){
  if(!p.scans.length) return '';
  return `<h3 class="step" style="margin-top:20px">比較の履歴（${p.scans.length}回）</h3>`+p.scans.slice().reverse().slice(0,15).map(s=>{

    return `<div class="card row">
      ${imgSrc(s.imgId)?`<img class="thumb" src="${imgSrc(s.imgId)}" alt="">`:''}

        <div class="small">${(s.checks||[]).filter(c=>c.status!=='INTACT').map(c=>`${esc(c.part)}:${STATUS[c.status]?.label||esc(c.status)}`).join('・')||'全テル正常'}</div>

function vLog(p){
  const H=p.pitches, nS=H.filter(x=>x.actual==='S').length;
  const withPred=H.filter(x=>x.pred), hits=withPred.filter(x=>x.pred===x.actual).length;
  const list=H.slice().reverse().slice(0,S.logLimit);
  return `<div class="kpi">
      <div><b>${H.length}</b><span>記録した球数</span></div>
      <div><b>${H.length?pct(nS/H.length):'－'}</b><span>直球系の割合</span></div>
      <div><b>${withPred.length?pct(hits/withPred.length):'－'}</b><span>予測の的中（${hits}/${withPred.length}）</span></div>
    </div>
    <div class="card">
      <div class="sec mb">打者・ベンチへの共有メモ</div>
      <pre class="share" id="share-text">${esc(shareText(p))}</pre>
      <div class="grid2"><button class="btn sm" onclick="copyShare()">コピー</button><button class="btn sm" onclick="exportCsv()">CSVで書き出す</button></div>
    </div>
    <div class="row-between"><h2 class="sec">1球ごとの記録</h2><button class="btn xs" onclick="openReg(true)">投手情報を編集</button></div>
    ${H.length?'':`<div class="empty sm">まだ記録がありません。「計測」タブで1球ずつ記録しましょう。</div>`}
    <div class="card">${list.map(x=>`<div class="log-row"><span class="n">#${x.no||''}</span><span class="grow">${pitchLine(p,x)}</span><button class="x" onclick="delPitch('${x.id}')" aria-label="この記録を削除">×</button></div>`).join('')}
    ${H.length>S.logLimit?`<button class="btn sm full mt" onclick="S.logLimit+=40;render()">もっと見る（残り${H.length-S.logLimit}球）</button>`:''}</div>`;
}
function shareText(p){
  const ov=overall(p), H=p.pitches, nS=H.filter(x=>x.actual==='S').length;
  const lines=[`【${p.name}（${p.hand}）】記録${H.length}球${H.length?`・直球系${pct(nS/H.length)}`:''}`];
  const good=ov.items.filter(x=>x.st.ev==='strong'||x.st.ev==='promising').sort((a,b)=>EV_RANK[a.st.ev]-EV_RANK[b.st.ev]);
  good.forEach(x=>{
    const t=x.tell, mark=x.st.ev==='strong'?'◎':'○';
    let body;
    if(t.type==='state') body=`${signText(t,'S',p)}なら直球／${signText(t,'B',p)}なら変化球　的中${x.st.k}/${x.st.n}`;
    else if(t.type==='presence') body=`「${t.action}」が出たら${t.side==='S'?'直球':'変化球'}　出た時${x.st.k}/${x.st.n}`;
    else if(t.type==='tempo'){ const ti=x.st.tempo; body=`${tempoBFast(t,ti)===false?'遅い':'速い'}と変化球　直球${ti.mS!=null?ti.mS.toFixed(2):'－'}秒／変化球${ti.mB!=null?ti.mB.toFixed(2):'－'}秒　的中${x.st.k}/${x.st.n}`; }
    else body=`直球＝${t.straight||'－'}／変化球＝${t.breaking||'－'}　的中${x.st.k}/${x.st.n}`;
    lines.push(`${mark} ${t.part}（${timingText(t)}）：${body}${t.cue?`\n　打者へ：${t.cue}`:''}`);
  });
  if(!good.length) lines.push('まだ信頼できるテルはありません（記録を続けてください）');
  ov.msgs.forEach(m=>lines.push(`注意：${m.text}`));
  return lines.join('\n');
}

// 計測
function setObs(tid,o){
  if(S.cur.obs[tid]===o) delete S.cur.obs[tid]; else { S.cur.obs[tid]=o; if(o==='?') delete S.cur.tempo[tid]; }
  haptic(10); render();
}
// ストップウォッチ：1回目のタップで開始、2回目で停止。止めた後にもう一度押すと測り直し
function tapTempo(ev,tid){
  ev.preventDefault();
  const now=performance.now(), c=S.cur.tempo[tid];
  if(c&&c.start!=null){ S.cur.tempo[tid]={start:null,sec:Math.round((now-c.start))/1000}; haptic(15); }
  else { S.cur.tempo[tid]={start:now,sec:null}; delete S.cur.obs[tid]; haptic(10); }
  render(); startTick();
}
let tickId=null;
function startTick(){
  if(tickId) return;
  const loop=()=>{
    let running=false;
    for(const [tid,c] of Object.entries(S.cur.tempo||{})){
      if(c.start==null) continue; running=true;
      const el=document.getElementById('tw-'+tid); if(el) el.textContent=((performance.now()-c.start)/1000).toFixed(2);
    }
    tickId=running?requestAnimationFrame(loop):null;
  };
  tickId=requestAnimationFrame(loop);
}
function stopTick(){ if(tickId) cancelAnimationFrame(tickId); tickId=null; }
function setCurSet(k){ S.cur.set=k; render(); }
function clearObs(){ S.cur.obs={}; S.cur.tempo={}; render(); }
function recordPitch(side,kind){
  const p=curP(); if(!p) return;
  const before=overall(p).level;
  const running=Object.values(S.cur.tempo).some(c=>c.start!=null);
  if(running){ toast('ストップウォッチが動いたままです。止めてから結果を押してください','warn',3000); return; }
  const pred=predict(p);
  let predSide=null, predProb=null;
  if(pred.used.length){
    if(pred.unverified) predSide=pred.votes>0?'S':pred.votes<0?'B':null;
    else { predSide=pred.probS>=0.5?'S':'B'; predProb=Math.round(Math.max(pred.probS,1-pred.probS)*100); }
  }
  const no=(p.pitches[p.pitches.length-1]?.no||p.pitches.length)+1;
  const tempo={}; for(const [tid,c] of Object.entries(S.cur.tempo)) if(c.sec!=null) tempo[tid]=c.sec;
  p.pitches.push({id:uid(),no,ts:Date.now(),inning:S.cur.inning,set:S.cur.set,obs:{...S.cur.obs},tempo,pred:predSide,predProb,actual:side,kind});
  Store.save();
  S.cur.obs={}; S.cur.tempo={};
  const after=overall(p).level;
  if(lvRank(after)>lvRank(before) && lvRank(after)>=lvRank('CAUTION')){
    S.flash=true; haptic([200,100,200,100,300]);
    toast(`${LEVEL[after].icon} ${LEVEL[after].label}：テルが変わった可能性があります`,'crit',4000);
  }else{
    haptic(25);
    toast(predSide?(predSide===side?`#${no} 記録 ○予測的中`:`#${no} 記録 ×予測外れ`):`#${no} 記録しました`, predSide?(predSide===side?'ok':'warn'):'info',1500);
  }
  const jump=S.flash;
  render();
  if(jump) window.scrollTo(0,0);
}
function undoPitch(){
  const p=curP(); if(!p||!p.pitches.length) return;
  const x=p.pitches.pop(); Store.save();
  S.cur.obs={...x.obs}; S.cur.tempo={}; for(const [tid,v] of Object.entries(x.tempo||{})) S.cur.tempo[tid]={start:null,sec:v};
  render(); toast(`#${x.no||''} を取り消しました（サインは復元）`);
}
function delPitch(id){
  const p=curP(); if(!p) return;
  const x=p.pitches.find(y=>y.id===id); if(!x) return;
  askConfirm(`#${x.no||''}（${x.kind}）の記録を削除します。`,'削除する',()=>{ p.pitches=p.pitches.filter(y=>y.id!==id); Store.save(); render(); toast('削除しました'); });

async function saveTell(){

async function runAiScan(){
  const p=curP(); if(!p||!S.scan.img) return;
  if(!SET.apiKey){ toast('設定でAPIキーを入力してください','warn'); return; }
  const tells=sortedTells(p).filter(t=>t.active&&t.type!=='tempo').slice(0,6);
  const content=[]; let n=0;
  for(const t of tells){
    if(n>=8) break;
    if(imgSrc(t.imgS)){ content.push({type:'text',text:`参考：テル${t.id}「${t.part}」直球の時`},imgBlock(imgSrc(t.imgS))); n++; }
    if(imgSrc(t.imgB)&&n<8){ content.push({type:'text',text:`参考：テル${t.id}「${t.part}」変化球の時`},imgBlock(imgSrc(t.imgB))); n++; }
  }
  if(!n && imgSrc(p.thumbId)){ content.push({type:'text',text:'参考：登録時の投手の画像'},imgBlock(imgSrc(p.thumbId))); }
  content.push({type:'text',text:'今回のコマ'},imgBlock(S.scan.img),{type:'text',text:promptScan(p,tells)});
  S.scan.loading=true; S.scan.error=null; render();
  try{
    const r=await callClaude(content,SCAN_SCHEMA);
    S.scan.ai=r;
    (r.checks||[]).forEach(c=>{ if(STATUS[c.status]&&tells.some(t=>t.id===c.tell_id)) S.scan.status[c.tell_id]=c.status; });
    toast('AIの下書きを反映しました。目で確認して直してください','ok',3000);
  }catch(e){ S.scan.error=e.message; }
  S.scan.loading=false; render();
}
async function saveScan(){
  const p=curP(); if(!p) return;
  const C=S.scan, lv=scanLevel(p,C.status);
  const checks=Object.entries(C.status).map(([tid,st])=>({tellId:tid,part:p.tells.find(t=>t.id===tid)?.part||'',status:st,note:C.ai?.checks?.find(c=>c.tell_id===tid)?.note||''}));
  const changed=checks.filter(c=>c.status!=='INTACT'&&c.status!=='UNKNOWN');
  const before=overall(p).level;
  p.scans.push({id:uid(),ts:Date.now(),inning:C.inning,memo:C.memo,imgId:await storeImg(C.img),overall:lv,
    reason:changed.length?changed.map(c=>`${c.part}が${STATUS[c.status].label}`).join('、'):(C.ai?.reason||'登録時のテルを確認'),checks,source:C.ai?'ai+manual':'manual'});
  Store.save(); S.scan=freshScan();
  if(lvRank(lv)>=lvRank('ALERT')&&lvRank(lv)>lvRank(before)){ S.flash=true; haptic([200,100,300]); }
  render(); window.scrollTo(0,0); toast(`比較を保存しました（${LEVEL[lv].label}）`,lvRank(lv)>=lvRank('ALERT')?'crit':'ok');
}
function delScan(id){
  const p=curP(); const s=p?.scans.find(x=>x.id===id); if(!s) return;
  askConfirm('この比較記録を削除します。','削除する',()=>{ IDB.del(s.imgId); p.scans=p.scans.filter(x=>x.id!==id); Store.save(); render(); toast('削除しました'); });
}

// 共有・書き出し
async function copyShare(){
  const text=shareText(curP());
  try{ await navigator.clipboard.writeText(text); toast('コピーしました。LINEなどに貼り付けできます','ok'); }
  catch{
    const r=document.createRange(), el=document.getElementById('share-text'); r.selectNodeContents(el);
    const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('文字を選択しました。長押しでコピーしてください','warn',3000);
  }
}
async function saveFile(blob,name){
  const file=new File([blob],name,{type:blob.type});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); return; } }
  catch(e){ if(e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
const dateTag = () => new Date().toISOString().slice(0,10);
function exportCsv(){
  const p=curP(); if(!p) return;
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['番号','日時','回','ワインド/セット',...p.tells.map(t=>t.part),'予測','予測確率','結果(系統)','球種','的中'];
  const rows=p.pitches.map(x=>[x.no,new Date(x.ts).toLocaleString('ja-JP'),x.inning,x.set==='S'?'セット':'ワインド',
    ...p.tells.map(t=>{ const v=x.tempo?.[t.id]; if(typeof v==='number') return v.toFixed(2); const o=x.obs?.[t.id]; return o?obsLabel(t,o):''; }),
    x.pred?SIDE_NAME[x.pred]:'',x.predProb??'',SIDE_NAME[x.actual],x.kind,x.pred?(x.pred===x.actual?'○':'×'):'']);
  const body=[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  if(EMBED){ showText(`${p.name} の記録（CSV）`,body); return; }
  const csv='\uFEFF'+body;
  saveFile(new Blob([csv],{type:'text/csv'}),`tell-${p.name}-${dateTag()}.csv`);
}
function exportAll(){
  if(EMBED){ askConfirm('この共有ページではファイルを保存できません。バックアップは、URLで公開したアプリ本体から行ってください。','閉じる',()=>{},false); return; }
  const images={};
  Store.data.pitchers.forEach(p=>pitcherImgIds(p).forEach(i=>{ if(IMG[i]) images[i]=IMG[i]; }));
  const json=JSON.stringify({app:'tell-alert',version:2,exportedAt:new Date().toISOString(),pitchers:Store.data.pitchers,images});
  saveFile(new Blob([json],{type:'application/json'}),`tell-alert-backup-${dateTag()}.json`);
}
async function importAll(ev){
  const f=ev.target.files&&ev.target.files[0]; ev.target.value=''; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(d.app!=='tell-alert'||!Array.isArray(d.pitchers)) throw new Error('TELL ALERTのバックアップではありません');
    askConfirm(`${d.pitchers.length}人分のデータを読み込みます。同じ投手がいる場合は、読み込む側の内容で上書きします。`,'読み込む',async()=>{
      for(const [id,v] of Object.entries(d.images||{})){ if(String(v).startsWith('data:image/')) await IDB.put(id,v); }
      d.pitchers.map(normalizePitcher).forEach(np=>{
        const i=Store.data.pitchers.findIndex(x=>x.id===np.id);
        if(i>=0) Store.data.pitchers[i]=np; else Store.data.pitchers.push(np);
      });
      Store.save(); S.modal=null; S.form={}; goList(); toast('読み込みました','ok');
    },false);
  }catch(e){ toast('読み込めませんでした：'+e.message,'crit',4000); }
}

// サンプル投手（使い方を試すための例。実在の投手ではない）
const SAMPLE_VER=2; // サンプルの中身を変えたら上げる（古いサンプルを入れ替えるため）
function makeSample(){
  let seed=20261110; const rnd=()=>((seed=(seed*1103515245+12345)%2147483648)/2147483648);
  const pick=name=>catalogTell(CATALOG.find(x=>x.part===name));
  const p=normalizePitcher({name:'サンプル投手（例）',team:'例のデータ',hand:'右投げ',
    memo:'リストから4項目を選び、どちらが直球かは「記録から判断」で38球記録した例です。足を上げる高さは球種と関係がない想定、30球目以降はアゴを毎球引くようになった（クセを隠し始めた）想定です。'});
  p.sample=true; p.sampleVer=SAMPLE_VER;
  const glove=pick('グラブの角度'), chin=pick('アゴ・顔の角度'), legs=pick('足を上げる高さ'), tempo=pick('始動から着地の時間');
  p.tells=[glove,chin,legs,tempo];
  const t0=Date.now()-38*60000;
  for(let i=0;i<38;i++){
    const B=rnd()<0.38, actual=B?'B':'S';
    const kind=B?['スライダー','スライダー','フォーク','カーブ'][Math.floor(rnd()*4)]:(rnd()<0.8?'ストレート':'ツーシーム');
    const obs={}, tm={};
    obs[glove.id]=rnd()<0.12?'?':((B?rnd()<0.12:rnd()<0.9)?'a':'b');                    // 直球の時はグラブを立てることが多い
    obs[chin.id]= i<30 ? ((B?rnd()<0.85:rnd()<0.1)?'a':'b') : 'a';                       // 変化球の時にアゴを引く。30球目以降は毎球
    obs[legs.id]=rnd()<0.5?'a':'b';                                                      // 球種と関係なし
    tm[tempo.id]=Math.round(((B?0.84:0.94)+(rnd()-0.5)*0.16)*100)/100;                   // 変化球の時はやや速い
    const keep=S.cur; S.cur={obs:{...obs},tempo:{[tempo.id]:{start:null,sec:tm[tempo.id]}},inning:'1',set:'W'};
    const pr=predict(p); S.cur=keep;
    let pred=null, predProb=null;
    if(pr.used.length&&!pr.unverified){ pred=pr.probS>=0.5?'S':'B'; predProb=Math.round(Math.max(pr.probS,1-pr.probS)*100); }
    p.pitches.push({id:uid(),no:i+1,ts:t0+i*60000,inning:String(1+Math.floor(i/5)),set:rnd()<0.5?'W':'S',obs,tempo:tm,pred,predProb,actual,kind});
  }
  return p;
}
function loadSample(){
  if(Store.data.pitchers.some(p=>p.sample)){ toast('サンプルはすでに入っています'); return; }
  Store.data.pitchers.unshift(makeSample()); Store.save(); render(); toast('サンプル投手を追加しました','ok');
}

// 旧バージョン（tell_alert_final）からの引き継ぎ
async function migrateLegacy(){
  if(Store.data.pitchers.length) return;
  let old=null; try{ old=JSON.parse(localStorage.getItem(LS_OLD)||'null'); }catch{}
  if(!old||!Array.isArray(old.pitchers)||!old.pitchers.length) return;
  for(const op of old.pitchers){
    const p=normalizePitcher({id:op.id,name:op.name,hand:op.hand==='左投げ'?'左投げ':'右投げ',createdAt:Date.now(),
      tells:(op.tells||[]).map(t=>({...t,source:op.baseline?'ai':'manual'}))});
    if(op.baselineImg) p.thumbId=await storeImg(op.baselineImg);
    for(const s of (op.scans||[]).slice().reverse()){
      p.scans.push({id:s.id||uid(),ts:Date.now(),inning:s.inning&&s.inning!=='—'?s.inning:'',memo:s.memo||'',imgId:s.img?await storeImg(s.img):null,
        overall:LEVEL[s.result?.overall]?s.result.overall:'CLEAR',reason:s.result?.reason||'',
        checks:(s.result?.checks||[]).map(c=>({tellId:c.id,part:c.part,status:STATUS[c.status]?c.status:'UNKNOWN',note:c.delta||''})),source:'legacy'});
    }
    Store.data.pitchers.push(p);
  }
  if(Store.save()) toast(`以前のデータ（${old.pitchers.length}人）を引き継ぎました`,'ok',3500);
}

function localStorage_has(k){ try{ return localStorage.getItem(k)!=null; }catch{ return false; } }

// 計測中は画面を消さない
let wakeLock=null;
async function syncWake(){
  const want=SET.wake&&S.screen==='pitcher'&&S.tab==='live'&&document.visibilityState==='visible';
  try{
    if(want&&!wakeLock&&'wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); }
    else if(!want&&wakeLock){ const w=wakeLock; wakeLock=null; await w.release(); }
  }catch{}
}
document.addEventListener('visibilitychange',syncWake);
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{ if(SET.theme==='auto'){ applyTheme(); render(); } });

// ══════════════════════════════════════════════
// 起動
// ══════════════════════════════════════════════
(async function init(){
  loadSettings();
  if(EMBED){ SET.mode='offline'; if(!localStorage_has(LS_SET)) SET.theme='auto'; }
  applyTheme();
  Store.load();
  render();
  await IDB.open();
  if(!IDB.ok) toast('この環境では画像を保存できません（プライベートブラウズ等）','warn',4000);
  await IDB.loadAll();
  await migrateLegacy();
  // 古いサンプルは新しいものに入れ替える（サンプル以外のデータには触れない）
  const oldSample=Store.data.pitchers.findIndex(p=>p.sample&&p.sampleVer!==SAMPLE_VER);
  if(oldSample>=0){ Store.data.pitchers[oldSample]=makeSample(); Store.save(); }
  if(EMBED && !Store.data.pitchers.length){ Store.data.pitchers.push(makeSample()); Store.save(); }
  render();
  if(!EMBED && 'serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
